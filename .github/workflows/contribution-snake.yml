name: Update contribution snake

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Commit generated image
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add images/github-contribution-grid-snake-dark.svg
          git diff --cached --quiet || (git commit -m "chore: update contribution snake" && git push)
